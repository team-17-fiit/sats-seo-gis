[project]
name = "sats-seo-gis-backend"
version = "0.1.0"
description = "SATS-SEO-GIS – REST API /api/v1 a ETL pipeline (PostGIS)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: test potrebuje bežiacu PostGIS (DATABASE_URL); bez nej sa preskočí",
]
