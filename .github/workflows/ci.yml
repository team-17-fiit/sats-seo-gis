# =============================================================================
# CI - hlavna kontrola kvality (quality gate)
# -----------------------------------------------------------------------------
# Kedy bezi:  pri kazdom pushi do main a pri kazdom Pull Requeste do main.
# Co robi:    1) app-lint-unit      ESLint, TypeScript, Vitest (frontend)
#             2) backend-lint-unit  ruff + pytest (API a ETL, bez DB)
#             3) data-contract      PostGIS service: migracie + ETL nad fixtures,
#                                   datove kontrakty a licencna brana (US-11)
#             4) quality-gate       build, SEO + JSON-LD kontrola vsetkych stranok (T3-22, T3-04),
#                                   smoke + E2E (Playwright) vratane axe-core (T3-15) a mobilnych
#                                   budgetov LCP/CLS/JS (T3-14)
#             5) lighthouse         Lighthouse CI desktop + mobil s budgetmi (T3-14), paralelne s 4
#                                   (4 a 5 bezia az ked prejdu 1 a 2 - setri minuty)
# Ak nieco zlyha, PR sa nema mergovat (nastav v GitHub: Settings > Branches).
# Tazke testy (Firefox, WebKit, mobilny Playwright profil) su zamerne mimo:
# bezia rucne v heavy-gis.yml, aby rychle iteracie neboli pomale.
# Popis kontrol: docs/methodology/testing.md, seo-checks.md, performance-budgets.md.
# =============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ak pushnes novy commit do toho isteho PR, stary beh sa zrusi (setri minuty).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit testy (Vitest)
        run: npm run test:unit

  backend-lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: ruff check . && ruff format --check .
      - name: Unit testy (pytest, bez DB)
        run: pytest -q

  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: satsgis
          POSTGRES_USER: satsgis
          POSTGRES_PASSWORD: satsgis
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U satsgis -d satsgis"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://satsgis:satsgis@localhost:5432/satsgis
      TEST_DATABASE_URL: postgresql://satsgis:satsgis@localhost:5432/satsgis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: osm2pgsql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osm2pgsql
      - run: pip install -r backend/requirements-dev.txt
      - name: Migracie + ETL nad fixtures + datove kontrakty
        run: make data-fixtures
      - name: Integracne testy PostGIS repozitara
        working-directory: backend
        run: pytest -q -m db

  quality-gate:
    needs: [ app-lint-unit, backend-lint-unit ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app   # frontend je v priecinku app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (npm ci = presne podla lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      # SEO (T3-22) + strukturovane data (T3-04): kazda stranka z out/, bez prehliadaca, ~1 s.
      # Zhrnutie ide do "Summary" behu, cely zoznam do artefaktu ci-reports/seo-report.
      - name: SEO a JSON-LD kontrola (vsetky stranky)
        run: npm run test:seo

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Smoke (T2-12): kazdy typ stranky sa nacita bez chyb. Ak padne, plna sada
      # sa uz nespusti - rozbity build sa ukaze za par sekund.
      # Oba kroky zapisuju "blob" vysledky do vlastneho suboru v blob-report/,
      # krok "Spojenie Playwright reportov" z nich spravi jeden HTML report.
      - name: Smoke test (Playwright, desktop)
        run: npm run test:smoke -- --project=desktop --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/smoke.zip

      # Plna sada vratane tests/a11y.spec.js (axe-core, WCAG 2.2 AA) a tests/budgets.spec.js
      # (mobilny profil: LCP, CLS, velkost JS, CLS po nacitani mapy).
      - name: E2E + pristupnost + budgety (Playwright, desktop)
        run: npm run test:e2e -- --project=desktop --grep-invert @smoke --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/e2e.zip

      - name: Spojenie Playwright reportov (smoke + E2E)
        if: always() && hashFiles('app/blob-report/*.zip') != ''
        run: npx playwright merge-reports --reporter=html blob-report

      - name: Upload reportov (aj pri zlyhani)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/playwright-report
            app/seo-report
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    needs: [ app-lint-unit, backend-lint-unit ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

      # Budgety a prahy: app/lighthouse/budgets.cjs, app/lighthouse/lhci-config.cjs.
      # Obidva profily sa spustia vzdy (aj ked desktop padne), aby bolo vidno cely stav.
      - name: Lighthouse CI – desktop (6 typov stranok × 3 behy)
        id: desktop
        continue-on-error: true
        run: npm run lhci

      - name: Lighthouse CI – mobil (6 typov stranok × 5 behov)
        id: mobile
        continue-on-error: true
        run: npm run lhci:mobile

      - name: Upload reportov (aj pri zlyhani)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            app/.lighthouseci
            app/.lighthouseci-mobile
          if-no-files-found: ignore
          # .lighthouseci zacina bodkou; upload-artifact@v4 skryte subory bez tohto vynecha.
          include-hidden-files: true
          retention-days: 14

      - name: Vysledok budgetov
        if: steps.desktop.outcome == 'failure' || steps.mobile.outcome == 'failure'
        run: |
          echo "::error::Lighthouse budgety neprešli (desktop: ${{ steps.desktop.outcome }}, mobil: ${{ steps.mobile.outcome }}). Detaily v logu a v artefakte lighthouse-reports."
          exit 1
