# =============================================================================
# CI - hlavna kontrola kvality (quality gate)
# -----------------------------------------------------------------------------
# Kedy bezi:  pri kazdom pushi do main a pri kazdom Pull Requeste do main.
# Co robi:    1) app-lint-unit      ESLint, TypeScript, Vitest (frontend)
#             2) backend-lint-unit  ruff + pytest (API a ETL, bez DB)
#             3) data-contract      PostGIS service: migracie + ETL nad fixtures,
#                                   datove kontrakty a licencna brana (US-11)
#             4) quality-gate       build, E2E (Playwright), Lighthouse CI
#                                   (bezi az ked prejdu 1 a 2 - setri minuty)
# Ak nieco zlyha, PR sa nema mergovat (nastav v GitHub: Settings > Branches).
# Tazke testy (viac prehliadacov, mobilny Lighthouse) su zamerne mimo:
# bezia rucne v heavy-gis.yml, aby rychle iteracie neboli pomale.
# =============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ak pushnes novy commit do toho isteho PR, stary beh sa zrusi (setri minuty).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit testy (Vitest)
        run: npm run test:unit

  backend-lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: ruff check . && ruff format --check .
      - name: Unit testy (pytest, bez DB)
        run: pytest -q

  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: satsgis
          POSTGRES_USER: satsgis
          POSTGRES_PASSWORD: satsgis
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U satsgis -d satsgis"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://satsgis:satsgis@localhost:5432/satsgis
      TEST_DATABASE_URL: postgresql://satsgis:satsgis@localhost:5432/satsgis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: osm2pgsql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osm2pgsql
      - run: pip install -r backend/requirements-dev.txt
      - name: Migracie + ETL nad fixtures + datove kontrakty
        run: make data-fixtures
      - name: Integracne testy PostGIS repozitara
        working-directory: backend
        run: pytest -q -m db

  quality-gate:
    needs: [ app-lint-unit, backend-lint-unit ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app   # frontend je v priecinku app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (npm ci = presne podla lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E testy (Playwright, desktop)
        run: npm run test:e2e -- --project=desktop

      - name: Lighthouse CI (desktop, prahy >= 80)
        run: npm run lhci

      - name: Upload reportov (aj pri zlyhani)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/playwright-report
            app/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14
