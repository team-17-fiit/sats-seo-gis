# =============================================================================
# Deploy - statický web na GitHub Pages (T3-05, S3-2)
# -----------------------------------------------------------------------------
# Kedy beží:  po každom pushi do main (teda po zmergovaní PR) a ručne cez
#             Actions > Deploy > Run workflow.
# Čo robí:    `next build` so statickým exportom do app/out/ a nasadí ho na
#             https://team-17-fiit.github.io/sats-seo-gis/
# Jednorazové nastavenie: Settings > Pages > Build and deployment >
#             Source: GitHub Actions.
# Vlastná doména (T3-06): nastav repozitárovú premennú SITE_URL na doménu
#             (Settings > Secrets and variables > Actions > Variables);
#             podcesta sa potom vypne sama.
# =============================================================================
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GITHUB_TOKEN smie len čítať kód a nasadiť Pages, nič iné.
permissions:
  contents: read
  pages: write
  id-token: write

# Nasadzuje sa vždy len posledný commit z main; staršie rozbehnuté nasadenie sa zruší.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Kým nemáme vlastnú doménu (premenná SITE_URL), web beží na podceste /sats-seo-gis.
      - name: Adresa webu
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://team-17-fiit.github.io/sats-seo-gis" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/sats-seo-gis" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (statický export)
        run: npm run build

      # Jedna kontrola produkčného buildu (skutočná adresa a basePath): URL webu (T3-06) + celé SEO
      # a štruktúrované dáta (T3-22, T3-04). --production zakáže placeholder adresu (example.com,
      # dokumentácia Z-B.8) a overí overovacie meta tagy Search Console, ak sú nastavené.
      - name: Kontrola URL a SEO produkčného buildu
        run: npm run test:seo -- --production

      # Bez .nojekyll by GitHub Pages zahodil priečinok _next/ (podčiarknik = Jekyll ho ignoruje).
      - name: Pripraviť artefakt
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
